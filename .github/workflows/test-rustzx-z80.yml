name: rustzx-z80 tests

# Runs on every pull request, whatever it changes, because `zx-sidekick` requires these checks
# before merging: a PR they didn't run on could never be merged. Pushes to `zx-sidekick` run
# only when the processor, its z80test suites, or this workflow change. (`master` follows
# upstream and runs upstream's own copy of this file, so it isn't listed.)
on:
  push:
    branches: [ zx-sidekick ]
    paths:
      - 'rustzx-z80/**'
      - 'rustzx-test/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test-rustzx-z80.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces the run for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# zexall_alu8r and zexall_alu8rx take the longest, so they run in a job of their own while
# the rest of zexall runs beside them.
jobs:
  lint:
    name: "Format and clippy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Pinned: the crate denies clippy's pedantic lints, so a new stable clippy with a new
      # lint would otherwise fail this required check on every PR at once. Move it on purpose.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt -p rustzx-z80 -- --check
      - name: Clippy
        run: cargo clippy -p rustzx-z80 --all-targets -- -D warnings

  unit_tests:
    name: "Unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Debug build, so arithmetic overflow panics as it would in a caller's debug build
      - name: Test
        run: cargo test -p rustzx-z80

  zexall_batch_1:
    name: "Zexall tests batch 1"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release -p rustzx-z80 -- --ignored zexall_alu8r

  zexall_batch_2:
    name: "Zexall tests batch 2"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release -p rustzx-z80 -- --ignored --skip zexall_alu8r zexall

  z80test:
    name: "z80test-based tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # All of z80test.rs: the three z80test suites (ignored, so named in) and the block
      # instruction flags test (not ignored).
      - name: Test
        run: cargo test --release -p rustzx-test --test z80test -- --include-ignored --nocapture

  # Not a required check: the oldest Rust the crate says it builds with (rust-version).
  msrv:
    name: "Minimum Rust version"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.87
      - name: Check
        run: cargo check -p rustzx-z80
