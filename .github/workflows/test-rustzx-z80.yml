name: rustzx-z80 tests

# Runs on the fork's branch and on every pull request (including ones stacked on other
# branches), whenever the processor, its z80test suites, or this workflow change.
on:
  push:
    branches: [ master, zx-sidekick ]
    paths:
      - 'rustzx-z80/**'
      - 'rustzx-test/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test-rustzx-z80.yml'
  pull_request:
    paths:
      - 'rustzx-z80/**'
      - 'rustzx-test/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/test-rustzx-z80.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# zexall_alu8r and zexall_alu8rx take the longest, so they run in a job of their own while
# the rest of zexall runs beside them.
jobs:
  lint:
    name: "Format and clippy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt -p rustzx-z80 -- --check
      - name: Clippy
        run: cargo clippy -p rustzx-z80 --all-targets -- -D warnings

  unit_tests:
    name: "Unit tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Debug build, so arithmetic overflow panics as it would in a caller's debug build
      - name: Test
        run: cargo test -p rustzx-z80

  zexall_batch_1:
    name: "Zexall tests batch 1"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release -p rustzx-z80 -- --ignored zexall_alu8r

  zexall_batch_2:
    name: "Zexall tests batch 2"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release -p rustzx-z80 -- --ignored --skip zexall_alu8r zexall

  z80test:
    name: "z80test-based tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release -p rustzx-test -- --nocapture --ignored z80full z80ccf z80memptr
