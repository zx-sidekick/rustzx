[package]
name = "rustzx-core"
description = "ZX Spectrum emulator core library"
keywords = ["emulator", "game", "z80", "no_std"]

version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
full = ["ay", "precise-border", "embedded-roms", "autoload", "strum", "zlib"]
precise-border = []
embedded-roms = []
sound = []
ay = ["aym", "sound"]
autoload = []
zlib = ["miniz_oxide"]

[dependencies]
bitflags = "2.13"
lazy_static = { version = "1.5", features = ["spin_no_std"] }
enum_dispatch = "0.3.13"
aym = { workspace = true, optional = true }
rustzx-z80 = { workspace = true }
strum = { version = "0.28", default-features = false, features = [
    "derive",
], optional = true }
miniz_oxide = { version = "0.9", optional = true }
